<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-2xl p-8">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Profile</h2>

      <form method="POST" class="space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-gray-700 font-medium">Name</label>
          <input
            class="w-full border rounded p-2"
            type="text"
            name="name"
            value="{{ profile.name }}"
          />
        </div>

        <div>
          <label class="block text-gray-700 font-medium">Email</label>
          <input
            class="w-full border rounded p-2"
            type="email"
            name="email"
            value="{{ profile.email }}"
          />
        </div>

        <div>
          <label class="block text-gray-700 font-medium">Phone</label>
          <input
            class="w-full border rounded p-2"
            type="text"
            name="phone"
            value="{{ profile.phone }}"
          />
        </div>

        <div>
          <label class="block text-gray-700 font-medium">Degree</label>
          <input
            class="w-full border rounded p-2"
            type="text"
            name="degree"
            value="{{ profile.degree }}"
          />
        </div>

        <div>
          <label class="block text-gray-700 font-medium">School</label>
          <input
            class="w-full border rounded p-2"
            type="text"
            name="school"
            value="{{ profile.school }}"
          />
        </div>

        <div>
          <label class="block text-gray-700 font-medium">University</label>
          <input
            class="w-full border rounded p-2"
            type="text"
            name="university"
            value="{{ profile.university }}"
          />
        </div>

        <div>
          <label class="block text-gray-700 font-medium">Summary</label>
          <textarea
            class="w-full border rounded p-2"
            name="summary"
            rows="4"
          >{{ profile.summary }}</textarea>
        </div>

        <div>
          <label class="block text-gray-700 font-medium">Previous Work</label>
          <textarea
            class="w-full border rounded p-2"
            name="previous_work"
            rows="4"
          >{{ profile.previous_work }}</textarea>
        </div>

        <div>
          <label class="block text-gray-700 font-medium">Skills</label>
          <input
            class="w-full border rounded p-2"
            type="text"
            name="skills"
            value="{{ profile.skills }}"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-pink-400 text-white rounded p-2 hover:bg-green-700"
        >
          Update Profile
        </button>
      </form>
    </div>
  </body>
</html>
